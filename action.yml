name: Render Template
description: Renders file based on template and passed variables

author: step-security

branding:
  icon: file-text
  color: purple

inputs:
  template:
    description: Path to template
    required: true

  vars:
    description: Variables to use in template
    required: false

  vars_path:
    description: Path to YAML file with variables
    required: false

  result_path:
    description: Desired path to result file (optional)
    required: false

  timezone:
    description: Timezone to use in `date` template function
    required: false

outputs:
  result:
    description: Rendered file content

runs:
  using: 'docker'
  image: 'docker://ghcr.io/step-security/render-template:v1.12.0@sha256:4504d7c7a8ce71dc568def6b70b8b33a877fc7c93fc4f5dd3688bd5cb0e95ef7' #v1.12.0
  
